<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARCHIV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090d;
  --bg2:#111118;
  --line:rgba(255,255,255,.08);
  --text:#eceaf2;
  --muted:#7d7a8c;
  --pink:#ff4fd8;
  --cyan:#3ee6f0;
  --lila:#9b7bff;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{
  font-family:var(--sans);color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none;
}
img{image-rendering:auto}

/* very light film grain, the only retro hint on top of everything */
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.035;z-index:50}

/* ---------- Welcome ---------- */
#welcome{
  position:fixed;inset:0;z-index:20;background:#1428c8;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:"VT323",ui-monospace,monospace;color:#fff;
  --vcr:#1428c8;
}
#welcome::before{ /* colour bleed + soft vignette like an old tape */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,30,.55) 100%);
}
#welcome.boot{background:#000}
#welcome.gone{pointer-events:none;background:transparent;transition:background .5s ease .3s}
#welcome.gone .osd,#welcome.gone .vfx,#welcome.gone .vtrack{opacity:0;transition:opacity .25s}
.vfx{position:absolute;inset:0;pointer-events:none;z-index:3}
.vscan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
.vtrack{
  position:absolute;left:0;right:0;height:9vh;top:-12vh;pointer-events:none;z-index:4;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 9px,rgba(255,255,255,.12) 9px 10px,transparent 10px 23px,rgba(255,255,255,.18) 23px 26px,transparent 26px 41px),
    linear-gradient(to bottom,transparent,rgba(255,255,255,.12) 45%,rgba(255,255,255,.2) 55%,transparent);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 35%,#000 65%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 35%,#000 65%,transparent);
  height:5vh;filter:blur(.8px);
  animation:track 2.6s linear infinite;
}
@keyframes track{to{transform:translateY(125vh)}}
#welcome.boot .vtrack{animation-duration:.5s}
.osd{position:absolute;z-index:2;font-size:clamp(22px,3.4vw,40px);letter-spacing:.06em;line-height:1;
  text-shadow:2px 0 0 rgba(255,0,80,.6),-2px 0 0 rgba(0,220,255,.6)}
.osd.tl{top:max(22px,5vh);left:max(22px,5vw)}
.osd.tr{top:max(22px,5vh);right:max(22px,5vw)}
.osd.bl{bottom:max(22px,6vh);left:max(22px,5vw)}
.osd.br{bottom:max(22px,6vh);right:max(22px,5vw)}
.osd .blink{animation:cur 1s steps(1) infinite}
#welcome.boot .osd,#welcome.boot .wtext{visibility:hidden}
.wtext{position:relative;text-align:center;line-height:1}
.wtext .slice{position:absolute;inset:0;will-change:transform,opacity,filter}
.wtext .ghost{visibility:hidden}
.wtext{z-index:2}
.w-small{
  display:block;font-size:clamp(26px,4.4vw,48px);letter-spacing:.32em;text-indent:.32em;margin-bottom:.2em;
  text-shadow:2px 0 0 rgba(255,0,80,.7),-2px 0 0 rgba(0,220,255,.7);
}
.w-big{
  display:block;font-size:clamp(84px,22vw,250px);letter-spacing:.06em;text-indent:.06em;line-height:.85;
  text-shadow:4px 0 0 rgba(255,0,90,.75),-4px 0 0 rgba(0,230,255,.75),0 0 30px rgba(255,255,255,.35);
}
.wtext.in{animation:welcomeIn .9s steps(9) both}
@keyframes welcomeIn{0%{opacity:0;transform:scaleY(.02)}30%{opacity:1;transform:scaleY(.02) scaleX(1.3)}60%{transform:scaleY(1.15) skewX(-8deg)}80%{transform:translateX(6px)}100%{opacity:1;transform:none}}
.wjit{animation:jit 2.3s steps(1) infinite}
@keyframes jit{0%,100%{transform:none}41%{transform:translateX(-5px) skewX(4deg)}42%{transform:none}77%{transform:translateX(7px)}78%{transform:none}79%{transform:translateX(-3px)}80%{transform:none}}
.wcursor{display:inline-block;width:.5em;height:.8em;background:#fff;vertical-align:-.05em;margin-left:.15em;animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
/* the streak that shoots out to both sides */
.streak{
  position:absolute;left:50%;top:50%;height:2px;width:100vw;margin-left:-50vw;margin-top:-1px;
  background:linear-gradient(90deg,transparent,var(--cyan) 30%,#fff 50%,var(--pink) 70%,transparent);
  transform:scaleX(0);opacity:0;filter:drop-shadow(0 0 6px rgba(255,255,255,.7));
}
.skip{position:absolute;z-index:2;bottom:max(22px,6vh);font-size:clamp(18px,2.4vw,24px);color:rgba(255,255,255,.75);letter-spacing:.1em;animation:cur 1.2s steps(1) infinite}

/* ---------- Tape view ---------- */
#tapes{position:fixed;inset:0;touch-action:none}
.scene{position:absolute;inset:0;overflow:hidden;perspective:1100px;perspective-origin:50% 22%}
.aura{
  position:absolute;left:50%;top:48%;width:min(90vw,900px);height:min(60vh,520px);transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,var(--cc-soft,rgba(155,123,255,.18)),transparent);
  transition:background .6s ease;pointer-events:none;
}
.floorline{position:absolute;left:0;right:0;top:calc(47% + 120px);height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent)}
#stage{position:absolute;left:50%;top:47%;width:0;height:0;transform-style:preserve-3d}
.tape{
  --w:280px;--h:164px;--d:44px;
  position:absolute;left:calc(var(--w) / -2);top:calc(var(--h) / -2);
  width:var(--w);height:var(--h);transform-style:preserve-3d;cursor:pointer;
  --dim:0;--glow:0;
}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#17161e}
.face::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim);pointer-events:none}
.f-front{
  width:var(--w);height:var(--h);transform:translateZ(calc(var(--d) / 2));border-radius:4px;
  background:linear-gradient(160deg,#22212b 0%,#16151c 55%,#121118 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.04),
             0 0 calc(var(--glow) * 60px) calc(var(--glow) * 2px) var(--c-glow);
}
.f-back{width:var(--w);height:var(--h);transform:rotateY(180deg) translateZ(calc(var(--d) / 2));background:#121118;border-radius:4px}
.f-right,.f-left{width:var(--d);height:var(--h);left:calc((var(--w) - var(--d)) / 2);background:linear-gradient(90deg,#141319,#1c1b23 50%,#141319)}
.f-right{transform:rotateY(90deg) translateZ(calc(var(--w) / 2))}
.f-left{transform:rotateY(-90deg) translateZ(calc(var(--w) / 2))}
.f-top,.f-bottom{width:var(--w);height:var(--d);top:calc((var(--h) - var(--d)) / 2)}
.f-top{transform:rotateX(90deg) translateZ(calc(var(--h) / 2));background:#25242e}
.f-bottom{transform:rotateX(-90deg) translateZ(calc(var(--h) / 2));background:#0e0d13}

.label{
  position:absolute;left:14px;right:14px;top:12px;height:62px;border-radius:3px;
  background:#f3f1f7;color:#16151c;display:flex;align-items:center;padding:0 14px 0 18px;gap:12px;overflow:hidden;
}
.label::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.label .txt{flex:1;min-width:0}
.label .k{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:#8c899a}
.label .t{font-size:17px;font-weight:800;letter-spacing:.02em;margin-top:5px;white-space:nowrap}
.label .n{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--c);letter-spacing:-.02em}
.window{
  position:absolute;left:62px;right:62px;bottom:18px;height:54px;border-radius:4px;
  background:linear-gradient(180deg,#07070a,#0d0c12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:space-around;
}
.reel{
  width:38px;height:38px;border-radius:50%;
  background:
    radial-gradient(circle,#07070a 0 5px,transparent 5.5px),
    repeating-conic-gradient(rgba(255,255,255,.75) 0 14deg,transparent 14deg 60deg),
    radial-gradient(circle,#2a2933 0 100%);
  box-shadow:0 0 0 2px #2a2933;
}
.tape.active .reel{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{position:absolute;left:16px;bottom:22px;font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:#4a4858;writing-mode:vertical-rl;transform:rotate(180deg)}
.spine{position:absolute;inset:8px 12px;border-radius:2px;background:#f3f1f7;color:#16151c;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;font-size:11px;font-weight:700;overflow:hidden}
.spine::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.spine b{font-family:var(--mono);font-weight:500;color:var(--c)}
.back-txt{position:absolute;inset:18px;font-family:var(--mono);font-size:9px;line-height:2;color:#55536a;letter-spacing:.1em}
.back-txt em{font-style:normal;color:var(--c)}
.shadow{position:absolute;left:-150px;top:110px;width:300px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);transform:rotateX(90deg);pointer-events:none}

/* HUD */
.hud{position:absolute;z-index:5;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,4vw);pointer-events:none;opacity:0;transition:opacity .8s ease}
#tapes.ready .hud{opacity:1}
.hud.top{top:max(22px,env(safe-area-inset-top))}
.hud.bottom{bottom:max(26px,env(safe-area-inset-bottom));flex-direction:column;gap:14px}
.logo{font-weight:800;font-size:15px;letter-spacing:.24em}
.logo i{font-style:normal;color:var(--cc,var(--lila));transition:color .4s}
#sound{
  pointer-events:auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--text);
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
#sound::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#sound.off{color:var(--muted)}
#sound.off::before{background:#3d3b48;box-shadow:none}
.bars{display:flex;gap:6px}
.bars{pointer-events:auto}
.bars button{appearance:none;border:0;background:none;padding:12px 0;cursor:pointer;display:block}
.bars button i{display:block;width:28px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .3s,width .3s}
.bars button:hover i{background:rgba(255,255,255,.35)}
.bars button.on i{width:44px;background:var(--cc,var(--lila))}
.bars button:focus-visible{outline:1px solid var(--muted);outline-offset:2px}
#counter{font-family:var(--mono);font-size:13px;letter-spacing:.18em;color:var(--muted)}
#counter span{color:var(--text)}
.hint{font-family:var(--mono);font-size:10px;color:#4a4858;letter-spacing:.12em;text-align:center;padding:0 16px}
</style>
</head>
<body>

<section id="tapes" aria-label="Kassetten">
  <div class="scene">
    <div class="aura"></div>
    <div id="stage"></div>
  </div>
  <div class="hud top">
    <span class="logo">ARCH<i>I</i>V</span>
    <button id="sound" type="button">SOUND AN</button>
  </div>
  <div class="hud bottom">
    <div class="bars" id="bars"></div>
    <div id="counter">TAPE <span id="cnum">1</span>/5</div>
    <div class="hint" id="hint">← → · 1–5 · DOPPELKLICK ZUM UMDREHEN</div>
  </div>
</section>

<div id="welcome" class="boot" aria-label="Willkommen">
  <div class="osd tl"><span class="blink">▶</span> PLAY</div>
  <div class="osd tr">SP</div>
  <div class="osd bl" id="tc">0:00:00</div>
  <div class="osd br">CH 03</div>
  <div class="vfx vscan"></div>
  <div class="vtrack"></div>
  <div class="wtext" id="wtext">
    <div class="ghost" id="wsrc"><span class="w-small">WELCOME TO<span class="wcursor"></span></span><span class="w-big">ARCHIV</span></div>
  </div>
  <div class="streak" id="streak"></div>
  <div class="skip" id="skip">KLICKEN ZUM ÜBERSPRINGEN</div>
</div>

<canvas id="grain" width="200" height="120"></canvas>

<script>
(() => {
"use strict";

/* ================= DATA ================= */
const TAPES = [
  { title: "TAPE 01", num: "01", color: "#ff4fd8" },
  { title: "TAPE 02", num: "02", color: "#3ee6f0" },
  { title: "TAPE 03", num: "03", color: "#9b7bff" },
  { title: "TAPE 04", num: "04", color: "#ff7ab8" },
  { title: "TAPE 05", num: "05", color: "#6c9bff" },
];
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ================= GRAIN ================= */
const grain = document.getElementById("grain"), gctx = grain.getContext("2d");
const gimg = gctx.createImageData(grain.width, grain.height), gbuf = new Uint32Array(gimg.data.buffer);
setInterval(() => {
  for (let i = 0; i < gbuf.length; i++) { const v = (Math.random() * 255) | 0; gbuf[i] = 0xff000000 | (v << 16) | (v << 8) | v; }
  gctx.putImageData(gimg, 0, 0);
}, 80);

/* ================= AUDIO (unlocked by first interaction) ================= */
let actx = null, soundOn = true;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === "suspended") actx.resume();
}
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, initAudio, { passive: true }));
function tone(freq, start, dur, type = "square", vol = 0.04, slide = 0) {
  if (!actx || !soundOn || actx.state !== "running") return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const beep = () => { tone(880, 0, 0.05); tone(1320, 0.05, 0.07); };
function fizz() {
  if (!actx || !soundOn || actx.state !== "running") return;
  const len = actx.sampleRate * 0.6, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  f.type = "highpass"; f.frequency.value = 2500; g.gain.value = 0.08;
  s.buffer = b; s.connect(f).connect(g).connect(actx.destination); s.start();
}

/* ================= WELCOME: hold 2s, then fizzle out to both sides ================= */
const welcome = document.getElementById("welcome");
const wtext = document.getElementById("wtext");
const wsrc = document.getElementById("wsrc");
const streak = document.getElementById("streak");
const skip = document.getElementById("skip");
const isTouch = matchMedia("(pointer: coarse)").matches;
skip.textContent = isTouch ? "TIPPEN ZUM ÜBERSPRINGEN" : "KLICKEN ZUM ÜBERSPRINGEN";
document.getElementById("hint").textContent = isTouch ? "WISCHEN · LANG DRÜCKEN ZUM UMDREHEN" : "← → · 1–5 · DOPPELKLICK ZUM UMDREHEN";

const SLICES = 18;
const slices = [];
for (let i = 0; i < SLICES; i++) {
  const s = document.createElement("div");
  s.className = "slice";
  s.innerHTML = wsrc.innerHTML;
  const a = (i / SLICES) * 100, b = ((i + 1) / SLICES) * 100;
  s.style.clipPath = `inset(${a}% 0 ${100 - b - 0.3}% 0)`;
  wtext.appendChild(s);
  slices.push(s);
}
// tape "inserted": black + fast tracking noise, then the blue VCR screen appears
const tc = document.getElementById("tc");
const t0 = performance.now();
const tcTimer = setInterval(() => {
  const s = (performance.now() - t0) / 1000, f = Math.floor((s % 1) * 30);
  tc.textContent = `0:00:${String(Math.floor(s)).padStart(2, "0")}:${String(f).padStart(2, "0")}`;
}, 33);
setTimeout(() => {
  welcome.classList.remove("boot");
  wtext.classList.add("in");
  setTimeout(() => wtext.classList.add("wjit"), 900);
}, 450);

let welcomeDone = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
async function dissolve() {
  if (welcomeDone) return;
  welcomeDone = true;
  skip.style.opacity = 0;
  fizz();
  // bright streak shoots out left and right from the centre
  streak.animate([
    { transform: "scaleX(0)", opacity: 1 },
    { transform: "scaleX(1)", opacity: 1, offset: 0.55 },
    { transform: "scaleX(1.1) scaleY(.5)", opacity: 0 },
  ], { duration: 700, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
  // slices tear apart, alternating left / right, with jitter and blur
  const anims = slices.map((s, i) => {
    const dir = i % 2 ? 1 : -1;
    const dist = (55 + Math.random() * 70) * dir;
    const delay = Math.abs(i - SLICES / 2) * 14 + Math.random() * 60;
    return s.animate([
      { transform: "translateX(0)", opacity: 1, filter: "blur(0)" },
      { transform: `translateX(${dir * (3 + Math.random() * 6)}px)`, opacity: 1, filter: "blur(0)", offset: 0.12 },
      { transform: `translateX(${-dir * 4}px)`, opacity: 1, filter: "blur(0)", offset: 0.22 },
      { transform: `translateX(${dist}vw) scaleX(1.6)`, opacity: 0, filter: "blur(6px)" },
    ], { duration: 780, delay, easing: "cubic-bezier(.6,0,.3,1)", fill: "forwards" }).finished;
  });
  await wait(380);
  openTapes();
  welcome.classList.add("gone");
  await Promise.all(anims);
  await wait(400);
  clearInterval(tcTimer);
  welcome.remove();
}
setTimeout(dissolve, 450 + 900 + 2000);   // insert, title in, then 2 seconds hold
welcome.addEventListener("click", () => { initAudio(); dissolve(); });
addEventListener("keydown", e => { if (!welcomeDone && (e.key === "Enter" || e.key === " ")) dissolve(); });

/* ================= TAPES ================= */
const tapesView = document.getElementById("tapes");
const stage = document.getElementById("stage");
const barsEl = document.getElementById("bars");
const cnum = document.getElementById("cnum");
const tapeEls = TAPES.map((t, i) => {
  const el = document.createElement("div");
  el.className = "tape";
  el.style.setProperty("--c", t.color);
  el.style.setProperty("--c-glow", hexA(t.color, 0.45));
  el.innerHTML = `
    <div class="face f-front">
      <div class="label"><div class="txt"><div class="k">ARCHIV · VHS</div><div class="t">${t.title}</div></div><div class="n">${t.num}</div></div>
      <div class="window"><div class="reel"></div><div class="reel"></div></div>
      <div class="brand">E-180</div>
    </div>
    <div class="face f-back"><div class="back-txt">ARCHIV<br><em>${t.title}</em><br>NR. ${t.num} / 05<br>SP · 180 MIN</div></div>
    <div class="face f-right"></div>
    <div class="face f-left"></div>
    <div class="face f-top"><div class="spine"><span>${t.title}</span><b>${t.num}</b></div></div>
    <div class="face f-bottom"></div>`;
  el.addEventListener("click", () => { if (!dragMoved && !longPressed) goTo(i); });
  el.addEventListener("dblclick", e => { e.preventDefault(); if (i === current) toggleFlip(); });
  stage.appendChild(el);
  const bar = document.createElement("button");
  bar.type = "button"; bar.setAttribute("aria-label", t.title); bar.innerHTML = "<i></i>";
  bar.addEventListener("click", e => { e.stopPropagation(); if (e.detail) bar.blur(); if (interactive) goTo(i); });
  barsEl.appendChild(bar);
  return el;
});
const bars = [...barsEl.children];
const N = TAPES.length;

let pos = 0, target = 0, current = -1, scale = 1, introStart = -1, interactive = false;
// QoL: remember last viewed tape
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
{ const saved = parseInt(store.get("archiv.tape"), 10); if (saved >= 0 && saved < TAPES.length) pos = target = saved; }
// QoL: flip the active tape (double click / long press / F)
let flipped = false, flipAngle = 0, longPressed = false;
function toggleFlip() { flipped = !flipped; tone(flipped ? 520 : 780, 0, 0.06, "triangle", 0.05, flipped ? 260 : -260); }
// QoL: tilt with mouse / device orientation
let tiltX = 0, tiltY = 0, tiltTX = 0, tiltTY = 0, baseBeta = null;
addEventListener("mousemove", e => { tiltTX = (e.clientX / innerWidth) * 2 - 1; tiltTY = (e.clientY / innerHeight) * 2 - 1; });
document.addEventListener("mouseleave", () => { tiltTX = tiltTY = 0; });
function onOrient(e) {
  if (e.gamma == null || e.beta == null) return;
  if (baseBeta === null) baseBeta = e.beta;
  tiltTX = clamp(e.gamma / 25, -1, 1);
  tiltTY = clamp((e.beta - baseBeta) / 25, -1, 1);
}
let orientAsked = false;
function enableOrientation() {
  if (orientAsked || !window.DeviceOrientationEvent) return;
  orientAsked = true;
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === "granted") addEventListener("deviceorientation", onOrient); }).catch(() => {});
  } else addEventListener("deviceorientation", onOrient);
}
if (isTouch) addEventListener("pointerup", enableOrientation);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function layout() {
  scale = clamp(Math.min(innerWidth / 470, innerHeight / 540), 0.55, 1.4);
  stage.style.transform = `scale3d(${scale},${scale},${scale})`;
}
addEventListener("resize", layout);
layout();

function openTapes() {
  introStart = performance.now();
  setTimeout(() => { tapesView.classList.add("ready"); interactive = true; }, 700);
}
function goTo(i) { target = clamp(Math.round(i), 0, N - 1); }
addEventListener("contextmenu", e => { if (interactive) e.preventDefault(); });

let last = performance.now();
function render(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  pos += (target - pos) * (1 - Math.exp(-dt * 8));
  if (Math.abs(target - pos) < 0.0005) pos = target;
  const t = now / 1000;
  const k = 1 - Math.exp(-dt * 6);
  tiltX += (tiltTX - tiltX) * k; tiltY += (tiltTY - tiltY) * k;
  flipAngle += ((flipped ? 180 : 0) - flipAngle) * (1 - Math.exp(-dt * 7));
  const introT = introStart < 0 ? 0 : (now - introStart) / 1000;
  tapeEls.forEach((el, i) => {
    // intro: each tape unfolds from below, staggered from the centre outwards
    const p = clamp((introT - Math.abs(i - pos) * 0.09) / 0.9, 0, 1);
    const ip = easeOutBack(p);
    const d = i - pos, ad = Math.abs(d), s = Math.sign(d);
    const near = Math.min(ad, 1), far = Math.max(ad - 1, 0);
    const x = s * (near * 250 + far * 80) * Math.min(1, ip);
    const z = -near * 180 - far * 140;
    const act = Math.max(0, 1 - ad);
    const ry = -s * near * 58 + 14 * act + Math.sin(t * 1.1) * 5 * act + (-d * 6) * act + tiltX * 16 * act + flipAngle * act * act;
    const rx = Math.sin(t * 0.8) * 2 * act - tiltY * 10 * act;
    const y = Math.sin(t * 1.4) * 5 * act - act * 12;
    const introY = (1 - ip) * 260, introRX = (1 - ip) * -75;
    el.style.transform = `translate3d(${x}px,${y + introY}px,${z + act * 70}px) rotateY(${ry}deg) rotateX(${rx + introRX}deg)`;
    el.style.setProperty("--dim", Math.max(1 - p, Math.min(0.8, ad * 0.4)).toFixed(3));
    el.style.setProperty("--glow", (act * act * p).toFixed(3));
    el.classList.toggle("active", ad < 0.5);
  });
  const idx = clamp(Math.round(pos), 0, N - 1);
  if (idx !== current) {
    if (current !== -1) beep();
    current = idx;
    flipped = false;
    store.set("archiv.tape", idx);
    cnum.textContent = idx + 1;
    tapesView.style.setProperty("--cc", TAPES[idx].color);
    tapesView.style.setProperty("--cc-soft", hexA(TAPES[idx].color, 0.16));
    bars.forEach((b, j) => b.classList.toggle("on", j === idx));
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ---- wheel: continuous scroll, soft snap after idle ---- */
let wheelTimer = 0, wheelDir = 1;
addEventListener("wheel", e => {
  if (!interactive) return;
  e.preventDefault();
  let delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (e.deltaMode === 1) delta *= 32; else if (e.deltaMode === 2) delta *= 400;
  delta = clamp(delta, -120, 120);
  target = clamp(target + delta * 0.0045, -0.35, N - 0.65);
  wheelDir = Math.sign(delta) || wheelDir;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => goTo(wheelDir > 0 ? Math.ceil(target - 0.2) : Math.floor(target + 0.2)), 140);
}, { passive: false });

/* ---- keys ---- */
addEventListener("keydown", e => {
  if (!interactive) return;
  const k = e.key;
  if (k >= "1" && k <= String(N)) { goTo(+k - 1); return; }
  if (k === "f" || k === "F") { toggleFlip(); return; }
  if (k === "ArrowRight" || k === "ArrowDown") { e.preventDefault(); goTo(Math.round(target) + 1); }
  else if (k === "ArrowLeft" || k === "ArrowUp") { e.preventDefault(); goTo(Math.round(target) - 1); }
  else if (k === "Home") goTo(0);
  else if (k === "End") goTo(N - 1);
});

/* ---- swipe / drag ---- */
let lpTimer = 0, dragging = false, dragMoved = false, axis = 0, sx = 0, sy = 0, sTarget = 0, lastP = 0, lastT = 0, vel = 0;
tapesView.addEventListener("pointerdown", e => {
  if (!interactive || e.target.closest("button")) return;
  dragging = true; dragMoved = false; longPressed = false;
  sx = e.clientX; sy = e.clientY; sTarget = target; lastT = performance.now(); vel = 0;
  // long press on the active tape flips it
  clearTimeout(lpTimer);
  const hit = e.target.closest(".tape");
  if (hit && tapeEls.indexOf(hit) === current) {
    lpTimer = setTimeout(() => { if (dragging && !dragMoved) { longPressed = true; toggleFlip(); if (navigator.vibrate) navigator.vibrate(15); } }, 480);
  }
});
addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (!dragMoved) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
    dragMoved = true; clearTimeout(lpTimer); axis = Math.abs(dx) >= Math.abs(dy) ? 0 : 1;
    lastP = axis ? e.clientY : e.clientX;
  }
  const delta = axis ? dy : dx, cur = axis ? e.clientY : e.clientX;
  target = clamp(sTarget - delta / (230 * scale), -0.35, N - 0.65);
  const now = performance.now();
  vel = (cur - lastP) / Math.max(1, now - lastT); lastP = cur; lastT = now;
});
function endDrag() {
  if (!dragging) return;
  dragging = false; clearTimeout(lpTimer);
  if (longPressed) setTimeout(() => { longPressed = false; }, 0);
  if (dragMoved) { goTo(target + clamp(-vel * 0.9, -1.4, 1.4)); setTimeout(() => { dragMoved = false; }, 0); }
}
addEventListener("pointerup", endDrag);
addEventListener("pointercancel", endDrag);

/* ---- sound toggle ---- */
const soundBtn = document.getElementById("sound");
soundBtn.addEventListener("click", e => {
  e.stopPropagation();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "SOUND AN" : "SOUND AUS";
  soundBtn.classList.toggle("off", !soundOn);
  if (soundOn) { initAudio(); beep(); }
});
})();
</script>
</body>
</html>
